<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Profile Analysis — Kumaraguru Institute of Agriculture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
/* ============================================================
   KIA Batch Profile Analysis
   Standalone read-only dashboard. Shares the admission form's
   palette and typefaces so it reads as the same institution.
   Writes nothing: every figure here is counted in the browser
   from rows returned by the existing staff RPC.
   ============================================================ */
:root {
  --teal-900: #12332A;
  --teal-800: #1B4438;
  --teal-700: #235847;
  --teal-600: #2F6B4F;
  --sage-300: #B9CBB4;
  --sage-200: #D7E2D0;
  --wheat-100: #FBF7EE;
  --wheat-50:  #FFFDF8;
  --paper:     #FFFFFF;
  --soil-700:  #5B4636;
  --amber-600: #B4790E;
  --ink-900:   #24261F;
  --ink-600:   #565B4E;
  --ink-400:   #8B9084;
  --line:      #E4DECB;
  --error:     #B4432E;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-card: 0 1px 2px rgba(36,38,31,0.06), 0 8px 24px -12px rgba(36,38,31,0.12);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--wheat-100);
  color: var(--ink-900);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--teal-900); margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 28px;
  background: var(--wheat-50);
  border-bottom: 3px solid var(--amber-600);
}
.topbar__brand { display: flex; align-items: center; gap: 12px; }
.topbar__logo { height: 62px; width: auto; object-fit: contain; }
.topbar__title { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--teal-900); }
.topbar__subtitle { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-600); }
.topbar__actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.analytics-back-btn {
  padding: 9px 14px;
  font-size: 12.5px;
  white-space: nowrap;
}
.refresh-state {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--teal-700);
  padding: 6px 12px;
  border: 1px solid var(--sage-300);
  border-radius: 100px;
  white-space: nowrap;
}
.refresh-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal-600);
}
.refresh-dot.is-stale { background: var(--amber-600); }
.refresh-dot.is-error { background: var(--error); }

.shell { max-width: 1180px; margin: 0 auto; padding: 32px 28px 80px; }

/* ---------- sign-in gate ---------- */
.gate {
  max-width: 460px;
  margin: 40px auto;
  padding: 36px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.gate h1 { font-size: 26px; }
.gate p { color: var(--ink-600); font-size: 13.5px; margin: 8px 0 0; }
.gate form { display: grid; gap: 8px; margin-top: 24px; }
.gate label { font-size: 12.5px; font-weight: 600; color: var(--soil-700); }
.gate input {
  font-family: var(--font-body);
  font-size: 14px;
  padding: 9px 11px;
  width: 100%;
  background: var(--wheat-50);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink-900);
}
.gate input:focus {
  outline: none;
  border-color: var(--teal-600);
  box-shadow: 0 0 0 3px rgba(47,107,79,0.14);
}
.gate__error { min-height: 18px; margin: 4px 0 0; font-size: 12px; color: var(--error); }

.btn {
  font-family: var(--font-body);
  font-size: 13.5px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
}
.btn--primary { background: var(--teal-700); color: #fff; }
.btn--primary:hover { background: var(--teal-800); }
.btn--secondary { background: var(--paper); color: var(--teal-800); border-color: var(--line); }
.btn--secondary:hover { border-color: var(--teal-600); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- filter bar ---------- */
.filter-panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 18px 20px 16px;
  margin-bottom: 22px;
}
.filter-panel__head {
  margin-bottom: 12px;
}
.filter-panel__head h2 {
  font-size: 16px;
  margin: 0;
}
.filter-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(130px, 1fr));
  gap: 14px;
}
.filter-group {
  display: grid;
  gap: 6px;
}
.filter-group label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--soil-700);
  letter-spacing: .02em;
  text-transform: none;
}
.filter-group select {
  width: 100%;
  appearance: none;
  background: var(--wheat-50);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink-900);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 9px 11px;
  min-height: 40px;
}
.filter-group select:focus {
  outline: none;
  border-color: var(--teal-600);
  box-shadow: 0 0 0 3px rgba(47, 107, 79, 0.12);
}

/* ---------- headline count ---------- */
.headline {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 28px;
  padding-bottom: 22px;
  margin-bottom: 26px;
  border-bottom: 2px solid var(--teal-800);
}
.headline__figure {
  font-family: var(--font-display);
  font-size: 76px;
  font-weight: 600;
  line-height: 0.9;
  color: var(--teal-800);
  font-variant-numeric: tabular-nums;
}
.headline__label { font-size: 14px; color: var(--ink-600); max-width: 34ch; }
.headline__split { margin-left: auto; display: flex; gap: 26px; }
.headline__stat { text-align: right; }
.headline__stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 600;
  color: var(--teal-700);
  font-variant-numeric: tabular-nums;
}
.headline__stat span { font-size: 11.5px; color: var(--ink-400); }

/* ---------- chart grid ---------- */
.charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.chart-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 20px 22px 16px;
  display: flex;
  flex-direction: column;
}
.chart-card--wide { grid-column: 1 / -1; }
.chart-card__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}
.chart-card__head h2 { font-size: 16px; }
.chart-card__n { font-size: 11.5px; color: var(--ink-400); white-space: nowrap; }
.chart-card__canvas { position: relative; height: 240px; }
.chart-card--wide .chart-card__canvas { height: 300px; }
.chart-card__empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--ink-400);
  font-size: 12.5px;
  font-style: italic;
  text-align: center;
  padding: 0 20px;
}

/* ---------- district table ---------- */
.district-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.district-table th {
  text-align: left;
  font-size: 11px;
  letter-spacing: .03em;
  color: var(--soil-700);
  background: var(--wheat-50);
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
}
.district-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.district-table tr:last-child td { border-bottom: 0; }
.district-table td:last-child, .district-table th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.district-scroll { max-height: 300px; overflow-y: auto; }

/* ---------- district map ---------- */
.district-map-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
  align-items: flex-start;
}
.district-map {
  flex: 1 1 340px;
  min-width: 260px;
  max-width: 440px;
}
.district-map svg {
  width: 100%;
  height: auto;
  display: block;
}
.district-map__path {
  stroke: #FFFFFF;
  stroke-width: 1;
  cursor: default;
  transition: opacity .15s ease;
}
.district-map__path:hover { opacity: .82; }
.district-map__label {
  font-family: var(--font-body);
  font-size: 9.5px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}
.district-map__legend { margin-top: 12px; }
.district-map__legend-bar {
  height: 10px;
  border-radius: 4px;
  background: linear-gradient(to right, #F1EEDA, #F4D58B, #E0AC3F, #B4790E, #6E8F5C, #2F6B4F, #12332A);
}
.district-map__legend-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-400);
  margin-top: 4px;
}
.district-map.is-unavailable svg,
.district-map.is-unavailable .district-map__legend {
  display: none;
}
.district-list {
  flex: 1 1 340px;
  min-width: 260px;
}
.district-list__label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--soil-700);
  margin: 0 0 8px;
}

.footnote {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-400);
}

@media (max-width: 860px) {
  .shell { padding: 22px 16px 60px; }
  .charts { grid-template-columns: 1fr; }
  .headline__figure { font-size: 58px; }
  .headline__split { margin-left: 0; width: 100%; }
  .filter-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
  .topbar__actions {
    width: 100%;
    justify-content: flex-start;
  }
}
@media (max-width: 520px) {
  .topbar { flex-wrap: wrap; padding: 12px 16px; }
  .topbar__subtitle { display: none; }
  .topbar__actions {
    width: 100%;
    justify-content: space-between;
  }
  .analytics-back-btn {
    width: 100%;
    justify-content: center;
  }
  .filter-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <img src="logo.png" alt="Kumaraguru Institute of Agriculture" class="topbar__logo">
    <div>
      <p class="topbar__title">Kumaraguru Institute of Agriculture</p>
      <p class="topbar__subtitle">Batch Profile Analysis</p>
    </div>
  </div>
  <div class="topbar__actions">
    <button type="button" class="btn btn--secondary analytics-back-btn" id="backToDashboardBtn" aria-label="Back to Staff Dashboard">← Back to Staff Dashboard</button>
    <div class="refresh-state" id="refreshState" hidden>
      <span class="refresh-dot" id="refreshDot"></span>
      <span id="refreshText">Loading…</span>
    </div>
  </div>
</header>

<!-- Staff sign-in. The analytics RPC is granted to authenticated staff only,
     exactly as the existing staff dashboard requires. -->
<section class="gate" id="gateView">
  <h1>Staff sign-in</h1>
  <p>Analysis is drawn from submitted applications, so it's available to KIA staff accounts only.</p>
  <form id="gateForm">
    <label for="gateEmail">KIA email address</label>
    <input type="email" id="gateEmail" autocomplete="email" placeholder="name@kia.ac.in" required>
    <label for="gatePassword">Password</label>
    <input type="password" id="gatePassword" autocomplete="current-password" required>
    <p class="gate__error" id="gateError" role="alert"></p>
    <button type="submit" class="btn btn--primary" id="gateSubmit">Show the analysis</button>
  </form>
</section>

<main class="shell" id="dashboardView" hidden>

  <section class="filter-panel" aria-label="Analytics filters">
    <div class="filter-panel__head">
      <h2>Filters</h2>
    </div>
    <div class="filter-grid" id="filterGrid"></div>
  </section>

  <div class="headline">
    <span class="headline__figure" id="totalCount">0</span>
    <span class="headline__label">applications submitted so far, counted live as students complete the form.</span>
    <div class="headline__split">
      <div class="headline__stat"><b id="pendingCount">0</b><span>Awaiting review</span></div>
      <div class="headline__stat"><b id="approvedCount">0</b><span>Approved</span></div>
    </div>
  </div>

  <div class="charts" id="chartGrid">
    <!-- chart cards are built by the script below -->
  </div>

  <p class="footnote" id="footnote"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
/* ============================================================
   Read-only analytics.
   Data source: public.list_pending_admissions(p_status) — the same
   RPC the staff dashboard already calls. Called once per status and
   merged here, so no new database function is required and nothing
   in the submission flow is touched.
   ============================================================ */
(function () {
  "use strict";

  const REFRESH_MS = 30000;

  const gateView = document.getElementById("gateView");
  const gateForm = document.getElementById("gateForm");
  const gateEmail = document.getElementById("gateEmail");
  const gatePassword = document.getElementById("gatePassword");
  const gateError = document.getElementById("gateError");
  const gateSubmit = document.getElementById("gateSubmit");
  const dashboardView = document.getElementById("dashboardView");
  const chartGrid = document.getElementById("chartGrid");
  const refreshState = document.getElementById("refreshState");
  const refreshDot = document.getElementById("refreshDot");
  const refreshText = document.getElementById("refreshText");
  const footnote = document.getElementById("footnote");
  const filterGrid = document.getElementById("filterGrid");
  const backToDashboardBtn = document.getElementById("backToDashboardBtn");

  const FILTER_CONFIG = [
    { key: "admissionType", label: "Admission Type" },
    { key: "admissionQuota", label: "Quota" },
    { key: "gender", label: "Gender" },
    { key: "district", label: "District" },
    { key: "hostelStatus", label: "Hosteller / Dayscholar", displayMap: { Yes: "Hosteller", No: "Dayscholar" } },
    { key: "firstGraduate", label: "First Graduate", displayMap: { Yes: "Yes", No: "No" } },
    { key: "familyBackground", label: "Family Background" }
  ];

  const filterState = Object.fromEntries(FILTER_CONFIG.map(({ key }) => [key, "All"]));

  if (backToDashboardBtn) {
    backToDashboardBtn.addEventListener("click", () => {
      window.location.href = "index.html?view=staff-dashboard";
    });
  }

  function buildFilterControls() {
    if (!filterGrid) return;

    filterGrid.innerHTML = "";
    FILTER_CONFIG.forEach(({ key, label, displayMap }) => {
      const group = document.createElement("div");
      group.className = "filter-group";

      const controlLabel = document.createElement("label");
      controlLabel.setAttribute("for", `filter-${key}`);
      controlLabel.textContent = label;

      const select = document.createElement("select");
      select.id = `filter-${key}`;
      select.setAttribute("aria-label", label);

      const allOption = document.createElement("option");
      allOption.value = "All";
      allOption.textContent = "All";
      select.appendChild(allOption);

      select.addEventListener("change", (event) => {
        filterState[key] = event.target.value;
        refresh();
      });

      group.appendChild(controlLabel);
      group.appendChild(select);
      filterGrid.appendChild(group);
    });
  }

  function syncFilterOptions(applications) {
    const rows = applications.map((item) => normalizeAnalyticsForm(item.form || {}));

    FILTER_CONFIG.forEach(({ key, displayMap }) => {
      const select = document.getElementById(`filter-${key}`);
      if (!select) return;

      const rawValues = Array.from(new Set(rows
        .map((row) => {
          const value = normalizeAnalyticsField(key, row[key]);
          return value === null || value === undefined || value === "" ? null : value;
        })
        .filter((value) => value !== null && value !== undefined && value !== "")))
        .sort((a, b) => String(a).localeCompare(String(b)));

      const nextValue = rawValues.includes(filterState[key]) ? filterState[key] : "All";
      filterState[key] = nextValue;

      select.innerHTML = "";
      const allOption = new Option("All", "All");
      select.appendChild(allOption);

      rawValues.forEach((value) => {
        let label = value;
        if (displayMap && displayMap[value]) label = displayMap[value];
        select.appendChild(new Option(label, value));
      });

      select.value = nextValue;
    });
  }

  function getFilteredApplications(applications) {
    return applications.filter((item) => {
      const form = normalizeAnalyticsForm(item.form || {});
      return FILTER_CONFIG.every(({ key }) => {
        const selectedValue = filterState[key];
        if (!selectedValue || selectedValue === "All") return true;
        return normalizeAnalyticsField(key, form[key]) === selectedValue;
      });
    });
  }

  // Palette drawn from the admission form's own section accents so the
  // charts sit in the same visual family as the rest of the site.
  const SERIES = ["#235847", "#B4790E", "#3E6FB0", "#B4432E", "#7A5AA6", "#2C8C82", "#4C8A3F", "#5B4636", "#C4941A", "#2C3E60"];

  /* ---------------- chart definitions ----------------
     Add a new chart by adding one entry here. `field` is the key inside
     form_data; `order` pins the slice/bar sequence where a natural order
     exists. Everything else is automatic. */
  const SINGLE_CHARTS = [
    { id: "gender", title: "Gender", field: "gender", type: "doughnut", order: ["Male", "Female", "Other"] },
    { id: "admissionType", title: "Admission type", field: "admissionType", type: "doughnut", order: ["Counselling", "Management"] },
    { id: "hostelStatus", title: "Hostel accommodation", field: "hostelStatus", type: "doughnut", order: ["Yes", "No"], relabel: { Yes: "Hosteller", No: "Dayscholar" } },
    { id: "firstGraduate", title: "First graduate", field: "firstGraduate", type: "doughnut", order: ["Yes", "No"] },
    { id: "community", title: "Community", field: "community", type: "bar", order: ["OC", "BC", "BCM", "MBC", "DNC", "SC", "SCA", "ST"] },
    { id: "admissionQuota", title: "Admission quota", field: "admissionQuota", type: "bar", order: ["General", "Management", "7.5% Academic", "General Vocational"] },
    { id: "familyBackground", title: "Family background", field: "familyBackground", type: "doughnut", order: ["Agriculture", "Business", "Salaried", "Other"] },
    { id: "schoolType", title: "School type", field: "schoolType", type: "bar", order: ["Government", "Government-aided", "Private", "Matriculation", "CBSE", "ICSE"] },
    { id: "boardOfStudy", title: "Board of study", field: "boardOfStudy", type: "bar" },
    { id: "mediumOfStudy", title: "Medium of study", field: "mediumOfStudy", type: "doughnut" },
    { id: "residenceType", title: "Residence type", field: "residenceType", type: "doughnut", order: ["Own house", "Rented", "Farm house"] },
    { id: "landLocality", title: "Agricultural land locality", field: "landLocality", type: "doughnut", order: ["Rural", "Semi-urban", "Urban"] },
    { id: "motherTongue", title: "Mother tongue", field: "motherTongue", type: "bar" },
    { id: "religion", title: "Religion", field: "religion", type: "doughnut", order: ["Hindu", "Christian", "Muslim", "Other"] },
    { id: "bloodGroup", title: "Blood group", field: "bloodGroup", type: "bar", order: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"] }
  ];

  // Cross-tabs: how one field breaks down across another.
  const CROSS_CHARTS = [
    { id: "genderByAdmission", title: "Gender by admission type", rowField: "admissionType", colField: "gender",
      rowOrder: ["Counselling", "Management"], colOrder: ["Male", "Female", "Other"], wide: false },
    { id: "hostelByGender", title: "Hostel choice by gender", rowField: "gender", colField: "hostelStatus",
      rowOrder: ["Male", "Female", "Other"], colOrder: ["Yes", "No"], colRelabel: { Yes: "Hosteller", No: "Dayscholar" }, wide: false },
    { id: "quotaByCommunity", title: "Admission quota by community", rowField: "community", colField: "admissionQuota",
      rowOrder: ["OC", "BC", "BCM", "MBC", "DNC", "SC", "SCA", "ST"],
      colOrder: ["General", "Management", "7.5% Academic", "General Vocational"], wide: true }
  ];

  // XII cut-off, bucketed the way the printed batch report presents it.
  const CUTOFF_BINS = [
    { label: "≤ 120", min: -Infinity, max: 120.5 },
    { label: "121–140", min: 120.5, max: 140.5 },
    { label: "141–160", min: 140.5, max: 160.5 },
    { label: "161–170", min: 160.5, max: 170.5 },
    { label: "171–180", min: 170.5, max: 180.5 },
    { label: "181–190", min: 180.5, max: 190.5 },
    { label: "> 190", min: 190.5, max: Infinity }
  ];

  const charts = {};
  let refreshTimer = null;

  function showGate() {
    gateView.hidden = false;
    dashboardView.hidden = true;
    refreshState.hidden = true;
    clearInterval(refreshTimer);
    refreshTimer = null;
    gateEmail.focus();
  }

  function showDashboard() {
    gateView.hidden = true;
    dashboardView.hidden = false;
    refreshState.hidden = false;
  }

  async function initExistingSession() {
    try {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error) throw error;

      if (session) {
        showDashboard();
        buildLayout();
        await refresh();
        refreshTimer = setInterval(refresh, REFRESH_MS);
        return;
      }

      showGate();
    } catch (error) {
      console.error("Could not resolve existing Supabase session.", error);
      showGate();
    }
  }

  /* ---------------- counting helpers ---------------- */
  function cleanValue(value) {
    const text = String(value == null ? "" : value).trim();
    return text === "" ? null : text;
  }

  function normalizeText(value) {
    const text = cleanValue(value);
    if (!text) return null;
    return text
      .replace(/\s+/g, " ")
      .toLowerCase()
      .replace(/(^|[\s-])([a-z])/g, (match, separator, letter) => separator + letter.toUpperCase());
  }

  function normalizeMappedText(value, mappings) {
    const normalized = normalizeText(value);
    if (!normalized) return null;
    return mappings[normalized.toLowerCase()] || normalized;
  }

  const MOTHER_TONGUE_MAPPINGS = {
    tamil: "Tamil",
    english: "English",
    malayalam: "Malayalam",
    telugu: "Telugu",
    kannada: "Kannada",
    hindi: "Hindi"
  };

  const MEDIUM_OF_STUDY_MAPPINGS = {
    english: "English",
    tamil: "Tamil",
    "english medium": "English",
    "tamil medium": "Tamil Medium"
  };

  const BOARD_OF_STUDY_MAPPINGS = {
    "state board": "State Board",
    "state boar": "State Board",
    "state government": "State Board",
    "sate board government": "State Board",
    cbse: "CBSE",
    icse: "ICSE",
    matriculation: "Matriculation"
  };

  function normalizeMotherTongue(value) {
    return normalizeMappedText(value, MOTHER_TONGUE_MAPPINGS);
  }

  function normalizeMediumOfStudy(value) {
    return normalizeMappedText(value, MEDIUM_OF_STUDY_MAPPINGS);
  }

  function normalizeBoardOfStudy(value) {
    const normalized = normalizeText(value);
    if (!normalized) return null;
    const comparisonKey = normalized.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    return BOARD_OF_STUDY_MAPPINGS[comparisonKey] || normalized;
  }

  function normalizeAnalyticsField(field, value) {
    if (field === "district") return normalizeDistrict(value);
    if (field === "motherTongue") return normalizeMotherTongue(value);
    if (field === "mediumOfStudy") return normalizeMediumOfStudy(value);
    if (field === "boardOfStudy") return normalizeBoardOfStudy(value);
    return cleanValue(value);
  }

  const CANONICAL_DISTRICTS = [
    "Ariyalur", "Chengalpattu", "Chennai", "Coimbatore", "Cuddalore", "Dharmapuri",
    "Dindigul", "Erode", "Kallakurichi", "Kancheepuram", "Karur", "Krishnagiri",
    "Madurai", "Mayiladuthurai", "Nagapattinam", "Kanniyakumari", "Namakkal", "Perambalur",
    "Pudukottai", "Ramanathapuram", "Ranipet", "Salem", "Sivaganga", "Tenkasi", "Thanjavur",
    "The Nilgiris", "Theni", "Thoothukudi", "Tiruchirappalli", "Tirunelveli", "Tirupathur", "Tiruppur",
    "Tiruvallur", "Tiruvannamalai", "Tiruvarur", "Vellore", "Viluppuram", "Virudhunagar"
  ];

  // Keys are normalized below, so aliases can be added once without spreading
  // district-specific conditions through the analytics code.
  const DISTRICT_ALIASES = {
    "nilgiris": "The Nilgiris",
    "tirupur": "Tiruppur",
    "tirupattur": "Tirupathur",
    "dharampuri": "Dharmapuri",
    "sivagangai": "Sivaganga",
    "sivagangai district": "Sivaganga",
    "virdhunagar": "Virudhunagar"
  };

  function normalizeDistrictText(value) {
    const text = cleanValue(value);
    if (!text) return null;
    return text
      .replace(/[\u2013\u2014]/g, "-")
      .replace(/\s+/g, " ")
      .replace(/\s+district\s*$/i, "")
      .trim()
      .toLowerCase();
  }

  const canonicalDistrictByKey = new Map(
    CANONICAL_DISTRICTS.map((district) => [normalizeDistrictText(district), district])
  );
  const districtAliasByKey = new Map(
    Object.entries(DISTRICT_ALIASES).map(([alias, district]) => [normalizeDistrictText(alias), district])
  );

  function formatDistrictDisplay(value) {
    return value
      .split(/\s+/)
      .map((part) => part.split('-').map((segment) => segment ? segment.charAt(0).toUpperCase() + segment.slice(1) : "").join('-'))
      .join(" ");
  }

  function normalizeDistrict(value) {
    const key = normalizeDistrictText(value);
    if (!key) return null;

    const aliasedDistrict = districtAliasByKey.get(key);
    const aliasedKey = normalizeDistrictText(aliasedDistrict || key);
    return canonicalDistrictByKey.get(aliasedKey) || formatDistrictDisplay(key);
  }

  function normalizeAnalyticsForm(form) {
    if (!form || typeof form !== "object") return {};
    const normalized = { ...form };
    const identity = form.identity && typeof form.identity === "object" ? form.identity : {};
    const socialBackground = form.school_social_background && typeof form.school_social_background === "object"
      ? form.school_social_background
      : {};
    if (Object.prototype.hasOwnProperty.call(normalized, "district") && normalized.district !== null && normalized.district !== undefined) {
      normalized.district = normalizeDistrict(normalized.district);
    }

    const motherTongue = identity.mother_tongue
      ?? identity.motherTongue
      ?? normalized.mother_tongue
      ?? normalized.motherTongue;
    const boardOfStudy = socialBackground.board_of_study
      ?? socialBackground.boardOfStudy
      ?? normalized.board_of_study
      ?? normalized.boardOfStudy;
    const mediumOfStudy = socialBackground.medium_of_study
      ?? socialBackground.mediumOfStudy
      ?? normalized.medium_of_study
      ?? normalized.mediumOfStudy;
    normalized.motherTongue = normalizeMotherTongue(motherTongue);
    normalized.boardOfStudy = normalizeBoardOfStudy(boardOfStudy);
    normalized.mediumOfStudy = normalizeMediumOfStudy(mediumOfStudy);
    return normalized;
  }

  function countBy(rows, field) {
    const counts = new Map();
    rows.forEach((row) => {
      const value = normalizeAnalyticsField(field, row[field]);
      if (!value) return;
      counts.set(value, (counts.get(value) || 0) + 1);
    });
    return counts;
  }

  // Values in `order` come first in that sequence; anything unexpected
  // (a free-text mother tongue, say) follows, largest first.
  function orderedEntries(counts, order) {
    const entries = [];
    const seen = new Set();
    (order || []).forEach((key) => {
      if (counts.has(key)) {
        entries.push([key, counts.get(key)]);
        seen.add(key);
      }
    });
    Array.from(counts.entries())
      .filter(([key]) => !seen.has(key))
      .sort((a, b) => b[1] - a[1])
      .forEach((entry) => entries.push(entry));
    return entries;
  }

  function percent(value, total) {
    if (!total) return "0%";
    return Math.round((value / total) * 100) + "%";
  }

  /* ---------------- card scaffolding ---------------- */
  function buildCard(id, title, wide) {
    const card = document.createElement("section");
    card.className = "chart-card" + (wide ? " chart-card--wide" : "");
    card.innerHTML =
      '<div class="chart-card__head">' +
        "<h2></h2>" +
        '<span class="chart-card__n" id="n-' + id + '"></span>' +
      "</div>" +
      '<div class="chart-card__canvas"><canvas id="canvas-' + id + '"></canvas></div>';
    card.querySelector("h2").textContent = title;
    chartGrid.appendChild(card);
    return card;
  }

  function showEmpty(id, message) {
    const holder = document.querySelector("#canvas-" + id).parentElement;
    if (charts[id]) { charts[id].destroy(); delete charts[id]; }
    holder.innerHTML = '<p class="chart-card__empty">' + message + "</p>";
  }

  function restoreCanvas(id) {
    const holder = document.getElementById("canvas-" + id)
      ? document.getElementById("canvas-" + id).parentElement
      : document.querySelector("#n-" + id).closest(".chart-card").querySelector(".chart-card__canvas");
    if (!document.getElementById("canvas-" + id)) {
      holder.innerHTML = '<canvas id="canvas-' + id + '"></canvas>';
    }
    return document.getElementById("canvas-" + id);
  }

  /* ---------------- drawing ---------------- */
  function drawSingle(config, rows) {
    const counts = countBy(rows, config.field);
    const entries = orderedEntries(counts, config.order);
    const total = entries.reduce((sum, [, value]) => sum + value, 0);
    document.getElementById("n-" + config.id).textContent = total ? total + " recorded" : "";

    if (!total) {
      showEmpty(config.id, "No entries recorded yet.");
      return;
    }

    const labels = entries.map(([key]) => (config.relabel && config.relabel[key]) || key);
    const values = entries.map(([, value]) => value);
    const canvas = restoreCanvas(config.id);

    if (charts[config.id]) {
      charts[config.id].data.labels = labels;
      charts[config.id].data.datasets[0].data = values;
      charts[config.id].data.datasets[0].backgroundColor = labels.map((_, i) => SERIES[i % SERIES.length]);
      charts[config.id].update();
      return;
    }

    charts[config.id] = new Chart(canvas, {
      type: config.type,
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: labels.map((_, i) => SERIES[i % SERIES.length]),
          borderColor: "#FFFFFF",
          borderWidth: config.type === "doughnut" ? 2 : 0,
          borderRadius: config.type === "bar" ? 3 : 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: config.type === "doughnut" ? "52%" : undefined,
        plugins: {
          legend: {
            display: config.type === "doughnut",
            position: "right",
            labels: { boxWidth: 10, boxHeight: 10, font: { family: "Inter", size: 11.5 }, color: "#565B4E" }
          },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const value = ctx.parsed.y != null ? ctx.parsed.y : ctx.parsed;
                return " " + value + " (" + percent(value, total) + ")";
              }
            }
          }
        },
        scales: config.type === "bar" ? {
          x: { grid: { display: false }, ticks: { font: { family: "Inter", size: 11 }, color: "#565B4E" } },
          y: { beginAtZero: true, ticks: { precision: 0, font: { family: "Inter", size: 11 }, color: "#8B9084" }, grid: { color: "#E4DECB" } }
        } : undefined
      }
    });
  }

  function drawCross(config, rows) {
    const rowCounts = countBy(rows, config.rowField);
    const rowKeys = orderedEntries(rowCounts, config.rowOrder).map(([key]) => key);
    const colCounts = countBy(rows, config.colField);
    const colKeys = orderedEntries(colCounts, config.colOrder).map(([key]) => key);

    const relevant = rows.filter((row) => normalizeAnalyticsField(config.rowField, row[config.rowField]) && normalizeAnalyticsField(config.colField, row[config.colField]));
    document.getElementById("n-" + config.id).textContent = relevant.length ? relevant.length + " recorded" : "";

    if (!relevant.length || !rowKeys.length || !colKeys.length) {
      showEmpty(config.id, "Not enough entries recorded yet for this comparison.");
      return;
    }

    const datasets = colKeys.map((colKey, index) => ({
      label: (config.colRelabel && config.colRelabel[colKey]) || colKey,
      data: rowKeys.map((rowKey) => relevant.filter((row) =>
        normalizeAnalyticsField(config.rowField, row[config.rowField]) === rowKey && normalizeAnalyticsField(config.colField, row[config.colField]) === colKey).length),
      backgroundColor: SERIES[index % SERIES.length],
      borderRadius: 3
    }));

    const canvas = restoreCanvas(config.id);

    if (charts[config.id]) {
      charts[config.id].data.labels = rowKeys;
      charts[config.id].data.datasets = datasets;
      charts[config.id].update();
      return;
    }

    charts[config.id] = new Chart(canvas, {
      type: "bar",
      data: { labels: rowKeys, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "top", labels: { boxWidth: 10, boxHeight: 10, font: { family: "Inter", size: 11.5 }, color: "#565B4E" } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: "Inter", size: 11 }, color: "#565B4E" } },
          y: { beginAtZero: true, ticks: { precision: 0, font: { family: "Inter", size: 11 }, color: "#8B9084" }, grid: { color: "#E4DECB" } }
        }
      }
    });
  }

  function drawCutoff(rows) {
    const marks = rows
      .map((row) => parseFloat(String(row.xiiCutoff == null ? "" : row.xiiCutoff).replace(/[^0-9.]/g, "")))
      .filter((value) => !Number.isNaN(value) && value > 0);

    const nLabel = document.getElementById("n-cutoff");
    if (!marks.length) {
      nLabel.textContent = "";
      showEmpty("cutoff", "No cut-off marks recorded yet.");
      return;
    }

    const average = marks.reduce((sum, value) => sum + value, 0) / marks.length;
    nLabel.textContent = marks.length + " recorded · lowest " + Math.min(...marks).toFixed(1) +
      " · highest " + Math.max(...marks).toFixed(1) + " · average " + average.toFixed(1);

    const values = CUTOFF_BINS.map((bin) => marks.filter((mark) => mark > bin.min && mark <= bin.max).length);
    const canvas = restoreCanvas("cutoff");

    if (charts.cutoff) {
      charts.cutoff.data.datasets[0].data = values;
      charts.cutoff.update();
      return;
    }

    charts.cutoff = new Chart(canvas, {
      type: "bar",
      data: {
        labels: CUTOFF_BINS.map((bin) => bin.label),
        datasets: [{ data: values, backgroundColor: "#235847", borderRadius: 3 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => " " + ctx.parsed.y + " students (" + percent(ctx.parsed.y, marks.length) + ")" } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: "Inter", size: 11 }, color: "#565B4E" } },
          y: { beginAtZero: true, ticks: { precision: 0, font: { family: "Inter", size: 11 }, color: "#8B9084" }, grid: { color: "#E4DECB" } }
        }
      }
    });
  }

  // Districts are a long tail, so a ranked table reads better than 30 slices.
  function drawDistricts(rows) {
    const counts = countBy(rows, "district");
    const entries = Array.from(counts.entries())
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const total = entries.reduce((sum, [, value]) => sum + value, 0);
    const holder = document.getElementById("districtHolder");
    document.getElementById("n-districts").textContent = entries.length
      ? entries.length + (entries.length === 1 ? " district" : " districts")
      : "";

    if (!entries.length) {
      holder.innerHTML = '<p class="chart-card__empty">No districts recorded yet.</p>';
      return;
    }

    holder.innerHTML =
      '<div class="district-scroll"><table class="district-table">' +
      "<thead><tr><th>District</th><th>Students</th><th>Share</th></tr></thead><tbody>" +
      entries.map(([name, value]) =>
        "<tr><td>" + escapeHtml(name) + "</td><td>" + value + "</td><td>" + percent(value, total) + "</td></tr>"
      ).join("") +
      "</tbody></table></div>";
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
  }

  /* ---------------- district map ----------------
     Boundaries come from a small (~45 KB) public TopoJSON of Tamil Nadu's
     districts (github.com/udit-001/india-maps-data), fetched once and
     cached in `districtMapState`. Nothing here writes anywhere — it only
     colors shapes by the counts already computed above. */
  const DISTRICT_TOPO_URL = "https://raw.githubusercontent.com/udit-001/india-maps-data/273a91960b2317c8431e562942293de959e2bd68/topojson/states/tamilnadu.json";

  // The boundary source's district names -> this page's canonical names
  // (see CANONICAL_DISTRICTS above), so map counts line up with every
  // other chart on this page.
  const TOPO_DISTRICT_TO_CANONICAL = {
    "Thiruvallur": "Tiruvallur", "Chennai": "Chennai", "Krishnagiri": "Krishnagiri",
    "Tiruvannamalai": "Tiruvannamalai", "Dharmapuri": "Dharmapuri", "Salem": "Salem",
    "Erode": "Erode", "Nilgiris": "The Nilgiris", "Namakkal": "Namakkal",
    "Perambalur": "Perambalur", "Coimbatore": "Coimbatore", "Tiruchirappalli": "Tiruchirappalli",
    "Ariyalur": "Ariyalur", "Tiruppur": "Tiruppur", "Thanjavur": "Thanjavur",
    "Karur": "Karur", "Thiruvarur": "Tiruvarur", "Dindigul": "Dindigul",
    "Madurai": "Madurai", "Theni": "Theni", "Virudhunagar": "Virudhunagar",
    "Thoothukkudi": "Thoothukudi", "Kanyakumari": "Kanniyakumari", "Viluppuram": "Viluppuram",
    "Cuddalore": "Cuddalore", "Pudukkottai": "Pudukottai", "Sivaganga": "Sivaganga",
    "Ramanathapuram": "Ramanathapuram", "Nagapattinam": "Nagapattinam", "Kallakurichi": "Kallakurichi",
    "Tenkasi": "Tenkasi", "Tirunelveli": "Tirunelveli", "Vellore": "Vellore",
    "Ranipet": "Ranipet", "Tirupathur": "Tirupathur", "Kancheepuram": "Kancheepuram",
    "Chengalpattu": "Chengalpattu"
  };

  // Mayiladuthurai was carved out of Nagapattinam/Thiruvarur in 2020; the
  // boundary source predates that split and has no shape for it, so its
  // count is folded into Nagapattinam's shape on the map only. The ranked
  // list alongside the map still lists Mayiladuthurai on its own row.
  const DISTRICT_MAP_MERGE_INTO = { "Mayiladuthurai": "Nagapattinam" };

  // Warm amber (low) through to the dashboard's deep teal (high) — pulled
  // straight from the CSS custom properties above (amber-600, teal-600,
  // teal-900) so the map reads as part of the same palette as every other
  // chart, instead of a flat single-hue ramp.
  const MAP_ZERO_COLOR = "#F1EEDA";
  const MAP_COLOR_STEPS = ["#F4D58B", "#E0AC3F", "#B4790E", "#6E8F5C", "#2F6B4F", "#12332A"];

  let districtMapState = null; // { entries: [{ canonical, path, title, label }] }

  function isDarkFill(hex) {
    const c = hex.replace("#", "");
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.6;
  }

  function buildDistrictMapSvg(features) {
    const width = 480, height = 560;
    const projection = d3.geoMercator().fitSize([width, height], { type: "FeatureCollection", features });
    const pathGen = d3.geoPath(projection);
    const svgEl = document.getElementById("districtMapSvg");
    if (!svgEl) return null;
    svgEl.setAttribute("viewBox", "0 0 " + width + " " + height);
    svgEl.innerHTML = "";

    const entries = features.map((feature) => {
      const canonical = TOPO_DISTRICT_TO_CANONICAL[feature.properties.district] || feature.properties.district;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "district-map__path");
      path.setAttribute("d", pathGen(feature));
      path.setAttribute("fill", MAP_ZERO_COLOR);
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      path.appendChild(title);
      svgEl.appendChild(path);

      let label = null;
      if (pathGen.area(feature) > 140) {
        const center = pathGen.centroid(feature);
        label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", "district-map__label");
        label.setAttribute("x", center[0]);
        label.setAttribute("y", center[1]);
        svgEl.appendChild(label);
      }

      return { canonical, path, title, label };
    });

    return { entries };
  }

  async function loadDistrictMap() {
    const container = document.getElementById("districtMapContainer");
    const unavailable = document.getElementById("districtMapUnavailable");
    try {
      const response = await fetch(DISTRICT_TOPO_URL);
      if (!response.ok) throw new Error("Map boundary request failed");
      const topology = await response.json();
      const objectKey = Object.keys(topology.objects)[0];
      const geo = topojson.feature(topology, topology.objects[objectKey]);
      districtMapState = buildDistrictMapSvg(geo.features);
      if (unavailable) unavailable.hidden = true;
      if (container) container.classList.remove("is-unavailable");
    } catch (error) {
      console.error("Could not load district map boundaries.", error);
      districtMapState = null;
      if (unavailable) unavailable.hidden = false;
      if (container) container.classList.add("is-unavailable");
    }
  }

  function drawDistrictMap(rows) {
    if (!districtMapState) return;

    const counts = countBy(rows, "district");
    const mapCounts = new Map(counts);
    Object.entries(DISTRICT_MAP_MERGE_INTO).forEach(([from, into]) => {
      if (mapCounts.has(from)) {
        mapCounts.set(into, (mapCounts.get(into) || 0) + mapCounts.get(from));
      }
    });

    const max = districtMapState.entries.reduce((best, { canonical }) => Math.max(best, mapCounts.get(canonical) || 0), 0);
    // Domain starts at 1, not 0, so the lightest step in MAP_COLOR_STEPS is
    // reserved for the smallest nonzero district rather than being spent on
    // "no data" (that gets its own MAP_ZERO_COLOR below).
    const colorScale = max > 0 ? d3.scaleQuantize().domain([1, max]).range(MAP_COLOR_STEPS) : null;

    districtMapState.entries.forEach(({ canonical, path, title, label }) => {
      const value = mapCounts.get(canonical) || 0;
      const fill = value > 0 && colorScale ? colorScale(value) : MAP_ZERO_COLOR;
      path.setAttribute("fill", fill);
      title.textContent = canonical + ": " + value + (value === 1 ? " student" : " students");
      if (label) {
        label.textContent = value > 0 ? String(value) : "";
        label.setAttribute("fill", isDarkFill(fill) ? "#FFFFFF" : "#3A3F30");
      }
    });

    const legendMax = document.getElementById("districtMapLegendMax");
    if (legendMax) legendMax.textContent = max ? String(max) : "0";
  }

  /* ---------------- build the page shell once ---------------- */
  function buildLayout() {
    SINGLE_CHARTS.forEach((config) => buildCard(config.id, config.title, false));
    CROSS_CHARTS.forEach((config) => buildCard(config.id, config.title, config.wide));

    buildCard("cutoff", "Class XII cut-off spread", true);

    const districtCard = document.createElement("section");
    districtCard.className = "chart-card chart-card--wide";
    districtCard.innerHTML =
      '<div class="chart-card__head"><h2>Students by district</h2>' +
      '<span class="chart-card__n" id="n-districts"></span></div>' +
      '<div class="district-map-wrap">' +
        '<div class="district-map" id="districtMapContainer">' +
          '<svg id="districtMapSvg" role="img" aria-label="Tamil Nadu map shaded by number of applicants per district"></svg>' +
          '<div class="district-map__legend">' +
            '<div class="district-map__legend-bar"></div>' +
            '<div class="district-map__legend-labels"><span>0</span><span id="districtMapLegendMax">0</span></div>' +
          '</div>' +
          '<p class="chart-card__empty" id="districtMapUnavailable" hidden>Map boundaries could not be loaded — see the ranked list.</p>' +
        '</div>' +
        '<div class="district-list">' +
          '<p class="district-list__label">Ranked list</p>' +
          '<div id="districtHolder"></div>' +
        '</div>' +
      '</div>';
    chartGrid.appendChild(districtCard);

    loadDistrictMap();
  }

  /* ---------------- data ---------------- */
  // Two calls to the existing staff RPC, one per status, merged here.
  async function fetchApplications() {
    const [pending, approved] = await Promise.all([
      supabaseClient.rpc("list_pending_admissions", { p_status: "Pending Review" }),
      supabaseClient.rpc("list_pending_admissions", { p_status: "Approved" })
    ]);
    if (pending.error) throw pending.error;
    if (approved.error) throw approved.error;

    const tag = (list, status) => (list || []).map((item) => ({
      status,
      submittedAt: item.submitted_at,
      form: item.form_data || {}
    }));

    return tag(pending.data, "Pending Review").concat(tag(approved.data, "Approved"));
  }

  function setRefreshState(text, variant) {
    refreshText.textContent = text;
    refreshDot.className = "refresh-dot" + (variant ? " is-" + variant : "");
  }

  function render(applications) {
    const normalizedApplications = applications.map((item) => ({
      ...item,
      form: normalizeAnalyticsForm(item.form || {})
    }));
    const filteredApplications = getFilteredApplications(normalizedApplications);
    const rows = filteredApplications.map((item) => item.form);
    const pendingTotal = filteredApplications.filter((item) => item.status === "Pending Review").length;
    const approvedTotal = filteredApplications.length - pendingTotal;

    document.getElementById("totalCount").textContent = filteredApplications.length;
    document.getElementById("pendingCount").textContent = pendingTotal;
    document.getElementById("approvedCount").textContent = approvedTotal;

    SINGLE_CHARTS.forEach((config) => drawSingle(config, rows));
    CROSS_CHARTS.forEach((config) => drawCross(config, rows));
    drawCutoff(rows);
    drawDistricts(rows);
    drawDistrictMap(rows);

    footnote.textContent = "Counted from " + filteredApplications.length +
      " submitted application" + (filteredApplications.length === 1 ? "" : "s") +
      " in the current filter selection (pending review and approved). Figures refresh every 30 seconds while this page stays open.";
  }

  async function refresh() {
    try {
      setRefreshState("Updating…", "stale");
      const applications = await fetchApplications();
      syncFilterOptions(applications);
      render(applications);
      setRefreshState("Updated " + new Date().toLocaleTimeString(), "");
    } catch (error) {
      console.error("Could not load applications.", error);
      setRefreshState("Update failed — retrying", "error");
    }
  }

  /* ---------------- sign-in ---------------- */
  gateForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    gateError.textContent = "";
    gateSubmit.disabled = true;
    gateSubmit.textContent = "Signing in…";

    try {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: gateEmail.value.trim().toLowerCase(),
        password: gatePassword.value
      });
      if (error) throw error;

      showDashboard();
      buildLayout();
      await refresh();
      refreshTimer = setInterval(refresh, REFRESH_MS);
    } catch (error) {
      console.error("Staff sign-in failed.", error);
      gateError.textContent = String(error && error.message ? error.message : "Could not sign in. Check the email and password.");
    } finally {
      gateSubmit.disabled = false;
      gateSubmit.textContent = "Show the analysis";
    }
  });

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
      if (session) {
        showDashboard();
        if (!chartGrid.children.length) {
          buildLayout();
        }
        refresh();
        if (!refreshTimer) {
          refreshTimer = setInterval(refresh, REFRESH_MS);
        }
      }
    }

    if (event === "SIGNED_OUT") {
      showGate();
    }
  });

  buildFilterControls();

  // Pause polling while the tab is hidden, resume on return.
  document.addEventListener("visibilitychange", () => {
    if (dashboardView.hidden) return;
    if (document.hidden) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    } else if (!refreshTimer) {
      refresh();
      refreshTimer = setInterval(refresh, REFRESH_MS);
    }
  });

  initExistingSession();
})();
</script>
</body>
</html>
